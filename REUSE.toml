# Licencias de cada fichero del repositorio (https://reuse.software/).
# Así no hace falta un fichero .license al lado de cada imagen.
version = 1

# Contenido creativo: historia, guion, personajes, ilustraciones y textos
[[annotations]]
path = [
  "book/**",
  "illustrations/**",
  "talk/**",
  "site/assets/**",
  "site/conto/pages/**",
  "README.md",
  "CONTRIBUTING.md",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC-BY-NC-4.0"

# Código: web, configuración de Pages y scripts
[[annotations]]
path = [
  "site/**/*.html",
  "site/**/*.css",
  "site/**/*.js",
  ".github/**",
  "talk/deck/*.py",
  "talk/deck/*.html",
  "talk/deck/layouts/**",
  ".pre-commit-config.yaml",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "MIT"

# Textos de licencia, configuración del repo y este fichero
[[annotations]]
path = [
  "LICENSE",
  "LICENSE-CODE",
  "LICENSES/**",
  ".gitignore",
  "REUSE.toml",
  "site/.nojekyll",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC0-1.0"

# Revisión lingüística del texto master en gallego
[[annotations]]
path = [
  "book/gl/texto.md",
  "site/conto/texto.md",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-FileContributor = ["2026 Mónica Pérez Sueiro (proofreader)"]
SPDX-License-Identifier = "CC-BY-NC-4.0"

# Tipografías incrustadas en la presentación
[[annotations]]
path = "talk/deck/fonts/**"
SPDX-FileCopyrightText = [
  "2021 The Outfit Project Authors (https://github.com/Outfitio/Outfit-Fonts)",
  "2012 Patrick Wagesreiter",
  "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)",
  "2010 Kimberly Geswein",
]
SPDX-License-Identifier = "OFL-1.1"

# Marca de WordCamp Galicia 2026 (no es de este proyecto)
[[annotations]]
path = [
  "talk/wordcamp-galicia-2026/event/wordcamp-galicia-2026-logo.png",
  "talk/wordcamp-galicia-2026/event/wordcamp-galicia-crab.png",
  "talk/wordcamp-galicia-2026/event/a-coruna-skyline.png",
]
SPDX-FileCopyrightText = "2026 WordCamp Galicia organisers / WordPress Foundation"
SPDX-License-Identifier = "LicenseRef-WordCamp-Galicia-branding"

# El QR solo contiene un enlace
[[annotations]]
path = "talk/wordcamp-galicia-2026/event/qr-repo.png"
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC0-1.0"
