# License of every file in the repository (https://reuse.software/),
# so no .license file is needed next to each image.
version = 1

# Creative content: story, talk script, characters, illustrations
[[annotations]]
path = [
  "book/**",
  "illustrations/**",
  "talk/**",
  "site/assets/**",
  "site/favicon.png",
  "site/apple-touch-icon.png",
  "site/conto/pages/**",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC-BY-NC-4.0"

# Code: website, Pages setup and scripts
[[annotations]]
path = [
  "site/**/*.html",
  "site/**/*.css",
  "site/**/*.js",
  ".github/**",
  "talk/*.py",
  "talk/deck/*.py",
  "talk/deck/*.html",
  "talk/deck/layouts/**",
  ".pre-commit-config.yaml",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "MIT"

# License texts, repo docs and configuration, and this file
[[annotations]]
path = [
  "LICENSE",
  "LICENSE-CODE",
  "LICENSES/**",
  ".gitignore",
  "REUSE.toml",
  "site/.nojekyll",
  "site/equipo.json",
  "CODE_OF_CONDUCT.md",
  "README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC0-1.0"

# Language review of the Galician master text
[[annotations]]
path = [
  "book/gl/texto.md",
]
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-FileContributor = ["2026 Mónica Pérez Sueiro (proofreader)"]
SPDX-License-Identifier = "CC-BY-NC-4.0"

# Fonts embedded in the slides and the website
[[annotations]]
path = ["talk/deck/fonts/**", "site/assets/fonts/**"]
SPDX-FileCopyrightText = [
  "2021 The Outfit Project Authors (https://github.com/Outfitio/Outfit-Fonts)",
  "2012 Patrick Wagesreiter",
  "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)",
  "2010 Kimberly Geswein",
  "2004-2022 SIL International (Andika; subset renamed Conto Sans)",
]
SPDX-License-Identifier = "OFL-1.1"

# WordCamp Galicia 2026 branding (not part of this project)
[[annotations]]
path = [
  "talk/wordcamp-galicia-2026/event/wordcamp-galicia-2026-logo.png",
  "talk/wordcamp-galicia-2026/event/a-coruna-skyline.png",
]
SPDX-FileCopyrightText = "2026 WordCamp Galicia organisers / WordPress Foundation"
SPDX-License-Identifier = "LicenseRef-WordCamp-Galicia-branding"

# The QR code only contains a link
[[annotations]]
path = "talk/wordcamp-galicia-2026/event/qr-repo.png"
SPDX-FileCopyrightText = "2026 Andrea Magán Rey"
SPDX-License-Identifier = "CC0-1.0"
