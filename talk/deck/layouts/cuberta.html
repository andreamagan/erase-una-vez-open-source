<div class="libro-obj">
    <i class="bloque"></i>
    <div class="tapa-cara">
      <i class="grano"></i>
      <i class="recuadro"></i>
      <i class="esq e1"></i><i class="esq e2"></i><i class="esq e3"></i><i class="esq e4"></i>
      <div class="cub-tit"><span style="font-size:68px">{{title_1}}</span><br><span style="display:inline-block;margin-top:10px;font-size:42px">{{title_2}}</span></div>
      <svg aria-hidden="true" viewBox="0 0 40 50" width="34" height="42" style="position:absolute;top:124px;left:147px;z-index:1">
        <g stroke="#B5432E" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="32" y1="8" x2="14" y2="2"/>
          <line x1="28" y1="25" x2="4" y2="25"/>
          <line x1="32" y1="42" x2="14" y2="48"/>
        </g>
      </svg>
      <svg aria-hidden="true" viewBox="0 0 40 50" width="34" height="42" style="position:absolute;top:124px;right:147px;z-index:1;transform:scaleX(-1)">
        <g stroke="#B5432E" stroke-width="5" stroke-linecap="round" fill="none">
          <line x1="32" y1="8" x2="14" y2="2"/>
          <line x1="28" y1="25" x2="4" y2="25"/>
          <line x1="32" y1="42" x2="14" y2="48"/>
        </g>
      </svg>
      <i class="cub-regla"><img src="{{asset:illustrations/decor/cenefa.png}}" alt=""></i>
      <div class="cub-sub">{{subtitle}}</div>
      <i class="cub-plato"></i>
      <img class="cub-img" src="{{image}}" alt="" style="{{image_style}}">
      <div class="cub-sello" style="display:none"><i></i><span>{{author}}</span></div>
    </div>
</div>
