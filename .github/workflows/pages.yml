name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'book/**'
      - 'talk/**'
      - 'illustrations/**'
      - '.github/scripts/prepare-pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare the site for its URL
        # base_url is https://<user>.github.io/<repo> or, with a custom domain, https://<domain>
        run: python3 .github/scripts/prepare-pages.py site _site "${{ steps.pages.outputs.base_url }}"
      - name: Build the talk's slides
        run: python3 talk/deck/build-deck.py talk/wordcamp-galicia-2026 --out _site/charla/wordcamp-galicia-2026.html
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
